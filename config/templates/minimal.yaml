# No Risk Management Configuration
# All trades accepted, no risk filtering

strategy:
  name: "open_source_baseline"
  parameters:
    short_window: 7
    long_window: 21
    momentum_window: 10

risk:
  enabled: false              # Disable risk management
  bypass_mode: true           # Bypass all risk checks
  max_position_size: 1.0      # Allow 100%
  max_daily_loss: 1.0         # No daily loss limit
  max_drawdown: 1.0           # No drawdown limit
  enable_stop_loss: false     # No stop loss
  enable_take_profit: false   # No take profit
  enable_timeout: false       # No timeout

transaction:
  enabled: false              # No transaction costs

validation:
  enabled: true               # Keep validation for data quality
  lookahead_bias_check: true

execution:
  parallel: true
  max_workers: 8
  batch_size: 100

output:
  save_trades: true
  save_signals: false
  save_metrics: true
  save_visualizations: false
