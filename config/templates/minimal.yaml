# Minimal risk template - Ultra-safe learning configuration
# Perfect for beginners and testing new strategies

data:
  data_pool_dir: "data/pools"
  timeframe_folders:
    1minute: "1minute"
    5minute: "5minute"  
    15minute: "15minute"
    1hour: "1hour"
    1day: "1day"
  default_timeframe: "1minute"
  required_columns:
    - "timestamp"
    - "open"
    - "high"
    - "low"
    - "close"
    - "volume"
  date_format: "%Y-%m-%d"
  timezone: "Asia/Kolkata"

strategy:
  name: "mse"
  parameters: {}
  enabled: true
  description: "Minimal risk MSE strategy for learning"
  risk_profile: "minimal"
  initial_capital: 100000.0

risk:
  enabled: true
  bypass_mode: false
  max_position_size: 0.05        # Only 5% max position
  max_daily_loss: 0.01           # 1% daily loss limit  
  max_drawdown: 0.10             # 10% maximum drawdown
  max_concentration: 0.20        # 20% max concentration per ticker
  stop_loss_pct: 0.02            # 2% stop loss
  take_profit_pct: 0.04          # 4% take profit
  position_timeout_minutes: 120  # 2 hours timeout
  enable_stop_loss: true
  enable_take_profit: true
  enable_timeout: true

transaction:
  enabled: true
  model_type: "basic"
  brokerage_rate: 0.0003         # 0.03% brokerage
  fixed_cost: 0.0
  slippage_rate: 0.0001          # 0.01% slippage
  market_impact_factor: 0.05     # Lower impact for small positions
  enable_market_impact: true

options:
  enabled: false
  synthetic_enabled: false
  volatility_model: "black_scholes"
  interest_rate: 0.05
  dividend_yield: 0.0
  days_to_expiry: 30
  strike_range: 0.1
  greeks_calculation: false

validation:
  enabled: true
  lookahead_bias_check: true
  survivorship_bias_check: true
  data_quality_check: true
  min_data_points: 200           # More data required for safety
  max_missing_data_pct: 0.02     # 2% max missing data
  price_outlier_threshold: 2.0   # 2 standard deviations
  strict_mode: true              # Strict validation for safety

optimization:
  enabled: false
  method: "grid_search"
  max_iterations: 10
  cv_folds: 3
  test_size: 0.3
  random_state: 42

output:
  save_trades: true
  save_metrics: true
  save_plots: true
  save_base_data: true
  output_dir: "outputs"
  trade_file_format: "csv"
  base_file_format: "csv"
  metrics_file_format: "json"
  plot_format: "png"
  visualization_trade_source: "risk_approved_trades"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file_enabled: true
  console_enabled: true
  log_dir: "logs"
  max_file_size: "5MB"
  backup_count: 3

# Infrastructure configuration (absorbed from config.py)
broker:
  default_provider: "upstox"
  available_providers: ["upstox", "zerodha", "binance"]
  token_refresh_enabled: false  # Manual token management for beginners
  auto_refresh_minutes: 120

# Audit compliance configuration (from analysis report)
compliance:
  warmup_minutes: 525        # Always 525 min (audit requirement)
  use_previous_bar: true     # Always previous bar (audit requirement)  
  enable_two_bar_rule: true  # Always two-bar rule (audit requirement)
  cascade_prevention: true   # Default enabled
  default_exit_threshold: 0.8  # 80% by default (conservative)
  enforce_compliance: true   # Enforce all audit requirements

# Execution configuration
execution:
  parallel_processing: false  # Single-threaded for stability
  max_workers: 1
  cache_enabled: true
  cache_dir: "cache"
  timeout_seconds: 1800       # 30 minutes timeout

# Global settings
base_dir: "."
run_id: ""  # Will be auto-generated