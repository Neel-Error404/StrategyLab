# RSI Divergence Strategy Configuration
# Detects bullish/bearish divergences between price and RSI momentum

strategy:
  name: strategy_rsi_divergence
  description: "RSI divergence strategy - detects bullish/bearish divergences between price action and RSI momentum for reversal signals"
  risk_profile: moderate
  timeframes:
    entry: [5m]
    exit: [5m]

  # Strategy parameters
  parameters:
    entry_timeframe: 5m
    rsi_period: 14           # RSI calculation period
    lookback_bars: 10        # How many bars to look back for divergence
    divergence_threshold: 3  # Minimum price/RSI movement for valid divergence
    intraday_cutoff: "15:15"
    min_volume: 0

  # Technical indicators configuration
  indicators:
    entry:
      - name: rsi_14
        type: rsi
        timeframe: 5m
        params:
          period: 14

risk:
  enabled: false
  bypass_mode: true

transaction:
  enabled: false

validation:
  enabled: true
  lookahead_bias_check: true

execution:
  parallel_processing: false
  max_workers: 1

output:
  save_trades: true
  save_signals: true
  save_metrics: true
  save_visualizations: false
