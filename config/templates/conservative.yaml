# Conservative trading configuration template
data:
  data_pool_dir: "data/pools"
  timeframe_folders:
    1minute: "1minute"
    5minute: "5minute"
    15minute: "15minute"
    1hour: "1hour"
    1day: "1day"
  default_timeframe: "1minute"
  required_columns:
    - "timestamp"
    - "open"
    - "high"
    - "low"
    - "close"
    - "volume"
  date_format: "%Y-%m-%d"
  timezone: "Asia/Kolkata"

strategy:
  name: "mse"
  parameters: {}
  enabled: true
  description: "Conservative MSE strategy"
  risk_profile: "conservative"

risk:
  max_position_size: 0.15    # 15% max position (allows portfolio diversification)
  max_daily_loss: 0.02       # 2% daily loss limit
  max_drawdown: 0.20         # 20% maximum drawdown
  max_concentration: 0.40    # 40% max concentration per ticker (allows 3+ tickers)
  stop_loss_pct: 0.05        # 5% stop loss
  take_profit_pct: 0.10      # 10% take profit
  position_timeout_minutes: 240  # 4 hours
  enable_stop_loss: true
  enable_take_profit: true
  enable_timeout: true

transaction:
  model_type: "advanced"
  brokerage_rate: 0.0003
  fixed_cost: 0.0
  slippage_rate: 0.0001
  market_impact_factor: 0.1
  enable_market_impact: true

broker:
  default_provider: "upstox"
  available_providers: ["upstox", "zerodha", "binance"]
  token_refresh_enabled: true
  auto_refresh_minutes: 60

# Audit compliance configuration (from analysis report)
compliance:
  warmup_minutes: 525        # Always 525 min (audit requirement)
  use_previous_bar: true     # Always previous bar (audit requirement)  
  enable_two_bar_rule: true  # Always two-bar rule (audit requirement)
  cascade_prevention: true   # Default enabled
  default_exit_threshold: 0.8  # 80% by default
  enforce_compliance: true   # Enforce all audit requirements

# Execution configuration
execution:
  parallel_processing: false  # Conservative - single threaded
  max_workers: 1
  cache_enabled: true
  cache_dir: "cache"
  timeout_seconds: 3600

# Global settings
base_dir: "."
run_id: ""  # Will be auto-generated

