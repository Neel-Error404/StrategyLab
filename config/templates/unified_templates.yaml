# Unified Configuration Template
# Example presets for common trading profiles

conservative_unified:
  strategy:
    name: "open_source_baseline"
    risk_profile: "conservative"
    initial_capital: 100000
    parameters:
      short_window: 8
      long_window: 26
      momentum_window: 14
      momentum_exit_buffer: 0.0
  risk:
    enabled: true
    max_position_size: 0.10
    max_daily_loss: 0.05
    stop_loss_pct: 0.03
    max_drawdown_pct: 0.15
    position_concentration_limit: 0.25
  transaction:
    enabled: true
    model_type: "advanced"
    commission_pct: 0.001
    slippage_pct: 0.0005
    market_impact_enabled: true
  validation:
    enabled: true
    strict_mode: false
    lookahead_bias_check: true
    min_data_points: 100
    max_missing_data_pct: 0.05
    price_outlier_threshold: 3.0

aggressive_unified:
  strategy:
    name: "open_source_baseline"
    risk_profile: "aggressive"
    initial_capital: 100000
    parameters:
      short_window: 5
      long_window: 18
      momentum_window: 10
      momentum_exit_buffer: -0.01
  risk:
    enabled: true
    max_position_size: 0.25
    max_daily_loss: 0.10
    stop_loss_pct: 0.05
    max_drawdown_pct: 0.25
    position_concentration_limit: 0.40
  transaction:
    enabled: true
    model_type: "advanced"
    commission_pct: 0.0015
    slippage_pct: 0.0010
    market_impact_enabled: true
  validation:
    enabled: true
    strict_mode: false
    lookahead_bias_check: true
    min_data_points: 50
    max_missing_data_pct: 0.10
    price_outlier_threshold: 4.0

development_unified:
  strategy:
    name: "open_source_baseline"
    risk_profile: "conservative"
    initial_capital: 50000
    parameters:
      short_window: 10
      long_window: 30
      momentum_window: 12
      momentum_exit_buffer: 0.0
  risk:
    enabled: true
    max_position_size: 0.05
    max_daily_loss: 0.02
    stop_loss_pct: 0.02
    max_drawdown_pct: 0.10
    position_concentration_limit: 0.15
  transaction:
    enabled: true
    model_type: "advanced"
    commission_pct: 0.0010
    slippage_pct: 0.0003
    market_impact_enabled: false
  validation:
    enabled: true
    strict_mode: true
    lookahead_bias_check: true
    min_data_points: 300
    max_missing_data_pct: 0.01
    price_outlier_threshold: 2.0
