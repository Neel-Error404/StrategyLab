# Aggressive trading configuration template
data:
  data_pool_dir: "data/pools"
  timeframe_folders:
    1minute: "1minute"
    5minute: "5minute"
    15minute: "15minute"
    1hour: "1hour"
    1day: "1day"
  default_timeframe: "1minute"
  required_columns:
    - "timestamp"
    - "open"
    - "high"
    - "low"
    - "close"
    - "volume"
  date_format: "%Y-%m-%d"
  timezone: "Asia/Kolkata"

strategy:
  name: "open_source_baseline"
  parameters:
    short_window: 5
    long_window: 20
    momentum_window: 10
    momentum_exit_buffer: -0.01
  enabled: true
  description: "Aggressive baseline trend + momentum configuration"
  risk_profile: "aggressive"

risk:
  max_position_size: 0.20    # 20% max position
  max_daily_loss: 0.05       # 5% daily loss limit
  max_drawdown: 0.25         # 25% maximum drawdown
  stop_loss_pct: 0.08        # 8% stop loss
  take_profit_pct: 0.15      # 15% take profit
  position_timeout_minutes: 480  # 8 hours
  enable_stop_loss: true
  enable_take_profit: true
  enable_timeout: true

transaction:
  model_type: "advanced"
  brokerage_rate: 0.0003
  fixed_cost: 0.0
  slippage_rate: 0.0001
  market_impact_factor: 0.15  # Higher impact for larger positions
  enable_market_impact: true

broker:
  default_provider: "upstox"
  available_providers: ["upstox", "zerodha", "binance"]
  token_refresh_enabled: true
  auto_refresh_minutes: 30  # More frequent refresh for aggressive trading

# Audit compliance configuration (from analysis report)
compliance:
  warmup_minutes: 525        # Always 525 min (audit requirement)
  use_previous_bar: true     # Always previous bar (audit requirement)  
  enable_two_bar_rule: true  # Always two-bar rule (audit requirement)
  cascade_prevention: true   # Default enabled
  default_exit_threshold: 0.2  # 20% for aggressive (can be overridden)
  enforce_compliance: true   # Enforce all audit requirements

# Execution configuration  
execution:
  parallel_processing: true  # Aggressive - use parallel processing
  max_workers: 4
  cache_enabled: true
  cache_dir: "cache"
  timeout_seconds: 7200  # Longer timeout for complex analysis

# Global settings
base_dir: "."
run_id: ""  # Will be auto-generated

