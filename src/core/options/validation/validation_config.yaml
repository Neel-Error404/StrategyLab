# Options Pricing Validation Configuration
# Phase 1: Synthetic vs Actual Pricing Comparison

validation:
  # Tickers to validate (liquid underlyings with deep options markets)
  tickers:
    - "NIFTY"
    - "BANKNIFTY"
    - "RELIANCE"
    - "TCS"
    - "INFY"
  # Manual override for reference prices when equity data is unavailable
  manual_reference_prices:
    RELIANCE: 1375.0

  # Date range for organizing fetched data
  # Format: YYYY-MM-DD_to_YYYY-MM-DD
  # If null, auto-generates from start_date/end_date below
  date_range: "2025-04-01_to_2025-10-08"

  # Equity data pool path (for reference price lookups)
  # If null, auto-detects latest pool from data/pools/
  equity_pool: "data/pools/2022-01-01_to_2025-08-31"  # Override auto-detect to ensure broad ticker coverage

  # Time period for validation
  time_period:
    # Fetch maximum available from Upstox (6 months of expired contracts)
    months: 6
    # Specific dates (leave empty to auto-fetch latest 6 months)
    start_date: "2025-04-01"  # Reference date lower bound (used for reference price lookup)
    end_date: null    # "2025-10-08" or null for today

  # Expiry types to include
  expiry_types:
    - "weekly"
    - "monthly"
    # - "quarterly"  # Uncomment if needed

  # Strike range to fetch (around ATM)
  strike_range:
    method: "percentage"  # percentage | absolute_count
    # If percentage: ±20% around current price
    percentage_range: 0.20  # Fetch strikes from 80% to 120% of underlying
    # If absolute_count: Number of strikes on each side
    strikes_per_side: 10

  # Data quality filters
  filters:
    # Minimum open interest (exclude illiquid contracts)
    min_open_interest: 100

    # Maximum number of strikes to request per expiry (closest to reference price)
    max_strikes: 40  # set to null to disable strike throttling

    # Maximum bid-ask spread (as % of mid price)
    max_spread_pct: 0.10  # 10%

    # Minimum volume (contracts/day)
    min_volume: 10

    # Exclude contracts within N days of expiry (too noisy)
    exclude_dte_below: 1

    # Exclude contracts with too much time (far-dated, less data)
    exclude_dte_above: 90

  # Timeframe for OHLC data
  timeframe: "1day"  # 1day | 1hour (daily sufficient for validation)

# Synthetic Pricing Models to Test
synthetic_models:
  # Model 1: Black-Scholes + 20-day historical volatility
  bs_hist_20d:
    name: "BS + 20-Day Historical Vol"
    method: "black_scholes"
    volatility:
      type: "historical"
      window: 20
      annualization_factor: 252  # Trading days per year
    risk_free_rate: 0.06
    enabled: true

  # Model 2: Black-Scholes + 5-day realized vol (short-term regime)
  bs_hist_5d:
    name: "BS + 5-Day Realized Vol"
    method: "black_scholes"
    volatility:
      type: "historical"
      window: 5
      annualization_factor: 252
    risk_free_rate: 0.06
    enabled: true

  # Model 3: Black-Scholes + Parkinson volatility (uses high-low range)
  bs_parkinson:
    name: "BS + Parkinson Volatility"
    method: "black_scholes"
    volatility:
      type: "parkinson"
      window: 20
      annualization_factor: 252
    risk_free_rate: 0.06
    enabled: true

  # Model 4: Black-Scholes + Calibrated IV (fit to ATM, apply skew)
  bs_calibrated_iv:
    name: "BS + Calibrated IV"
    method: "black_scholes"
    volatility:
      type: "calibrated_iv"
      calibration:
        atm_method: "closest_strike"  # Use closest strike to ATM for calibration
        skew_model: "linear"  # linear | polynomial | sticky_delta
        skew_coefficient: 0.15  # Empirical adjustment factor
    risk_free_rate: 0.06
    enabled: true

# Error Metrics to Calculate
metrics:
  # Primary metrics
  primary:
    - "mean_absolute_error"       # MAE in rupees
    - "mean_percentage_error"     # MPE in %
    - "median_percentage_error"   # Median error in %
    - "rmse"                      # Root Mean Squared Error

  # Distribution metrics
  distribution:
    - "std_error"                 # Standard deviation of errors
    - "p95_error"                 # 95th percentile error
    - "p99_error"                 # 99th percentile error
    - "max_error"                 # Maximum error observed

  # Bias metrics
  bias:
    - "systematic_bias"           # Average(synthetic - actual) / actual
    - "directional_accuracy"      # % of times synthetic > actual when it should be

# Segmentation for Analysis
segmentation:
  # By moneyness (S/K ratio for calls, K/S for puts)
  moneyness_bins:
    - name: "Deep ITM"
      min: 1.10
      max: 999  # No upper limit
    - name: "ITM"
      min: 1.05
      max: 1.10
    - name: "ATM"
      min: 0.95
      max: 1.05
    - name: "OTM"
      min: 0.90
      max: 0.95
    - name: "Deep OTM"
      min: 0
      max: 0.90

  # By days to expiry
  dte_bins:
    - name: "Very Short"
      min: 1
      max: 7
    - name: "Short"
      min: 8
      max: 30
    - name: "Medium"
      min: 31
      max: 60
    - name: "Long"
      min: 61
      max: 999

  # By volatility regime (based on realized vol)
  volatility_bins:
    - name: "Low Vol"
      min: 0
      max: 0.15
    - name: "Medium Vol"
      min: 0.15
      max: 0.25
    - name: "High Vol"
      min: 0.25
      max: 999

# Decision Criteria (auto-generate recommendations)
decision_criteria:
  # Acceptable error thresholds
  thresholds:
    excellent:
      atm_median_error: 0.05  # <5% median error
      recommendation: "Synthetic pricing is excellent. Hybrid mode highly recommended."

    good:
      atm_median_error: 0.10  # <10% median error
      recommendation: "Synthetic pricing is acceptable. Hybrid mode viable."

    acceptable:
      atm_median_error: 0.15  # <15% median error
      recommendation: "Synthetic pricing has noticeable bias. Use for directional strategies only. Prefer actual data for final validation."

    poor:
      atm_median_error: 0.25  # <25% median error
      recommendation: "Synthetic pricing is unreliable. Use actual data exclusively."

    unacceptable:
      atm_median_error: 999  # >25% median error
      recommendation: "Synthetic pricing fails validation. Must use actual data only. Consider limiting backtest period to data availability."

# Output Configuration
output:
  # Validation results directory
  output_dir: "src/core/options/data/validation_results"

  # File formats
  summary_report: "pricing_validation_summary.csv"
  detail_report: "pricing_validation_detail.csv"
  metrics_json: "validation_metrics.json"

  # Visualizations
  generate_plots: true
  plots:
    - "error_distribution_by_model"
    - "error_heatmap_moneyness_dte"
    - "error_timeseries"
    - "model_comparison_boxplot"
    - "bias_analysis"

  plot_format: "png"  # png | pdf | svg
  plot_dpi: 300

# Data Caching
caching:
  # Cache fetched options data locally
  enable_cache: true
  cache_dir: "src/core/options/data/cache"
  cache_format: "parquet"  # parquet | csv

  # Re-fetch if cache older than N days (0 = never re-fetch)
  cache_expiry_days: 0  # Never expire (static historical data)

  # Cache underlying data as well
  cache_underlying: true

# API Configuration (Upstox)
api:
  provider: "upstox"

  # Rate limiting
  rate_limit:
    requests_per_second: 2
    requests_per_minute: 90
    retry_attempts: 3
    retry_backoff_factor: 3  # Exponential backoff: 1s, 3s, 9s

  # Endpoints
  endpoints:
    expiries: "/v2/expired-instruments/expiries"
    option_contracts: "/v2/expired-instruments/option/contract"
    historical_candles: "/v2/expired-instruments/historical-candle"

  # Authentication (pulled from main config)
  # Credentials should be in environment variables or config/access_tokens/

# Logging
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: "logs/options_validation.log"
  log_format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# Parallel Processing
parallel:
  enable: true
  max_workers: 3  # Number of tickers to process in parallel
  chunk_size: 50  # Number of contracts to process per chunk
