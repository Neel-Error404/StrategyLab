run:
  run_id: "pool38_base"
  strategy: "mse_strategy_backtesting"
  date_range: "2022-01-01_to_2025-08-31"
  trade_source: "strategy_trades"
  label: "38ticker_pool_portfolio_construction"

data_sources:
  strategy_trades_dir: "D:\\Balcony\\Trading\\unified_trading_setup\\backtester\\outputs\\mse_exit_drop_005_all\\20251107_154802\\mse_strategy_backtesting\\2022-01-01_to_2025-08-31\\data\\strategy_trades"
  base_data_dir: "D:\\Balcony\\Trading\\unified_trading_setup\\backtester\\outputs\\mse_exit_drop_005_all\\20251107_154802\\mse_strategy_backtesting\\2022-01-01_to_2025-08-31\\data\\base_data"
  merged_trades_dir: null

merge:
  auto_generate: true
  trade_source: "strategy_trades"
  output_filename: "pool38_trades_merged.csv"
  # Filter to only 38 tickers under 2000
  ticker_filter:
    - AXISBANK
    - MAXHEALTH
    - INDHOTEL
    - POCL
    - NMDC
    - PNB
    - UBL
    - HERCULES
    - ITC
    - PSUBANK
    - NTPC
    - PIDILITIND
    - DELHIVERY
    - JINDALSTEL
    - FEDERALBNK
    - SUNPHARMA
    - IPCALAB
    - ABFRL
    - INFY
    - POWERGRID
    - IRFC
    - DABUR
    - PETRONET
    - VIMTALABS
    - TATASTEEL
    - MSUMI
    - RAMCOCEM
    - GRAPHITE
    - TATAMOTORS
    - PFC
    - SBICARD
    - NESTLEIND
    - WIPRO
    - VGUARD
    - TATACHEM
    - TECHM
    - SHYAMMETL
    - CIPLA

output:
  root_dir: "analysis/output"
  reports_root_dir: "analysis/reports"
  run_logs_dir: "analysis/run_logs"
  merged_filename: "pool38_trades_merged.csv"

analysis:
  generic:
    enabled: false  # Skip generic analysis, we already have it

  portfolio:
    enabled: true
    modules:
      ticker_ranking:
        enabled: false  # Skip - already have our 38 tickers selected
      anti_cascade_filter:
        enabled: true
        config:
          price_threshold: 2000
          top50_variant: anti_cascading  # Use anti-cascading trades only
          exclude_same_direction: true   # Filter cascading trades
      sector_classification:
        enabled: true
        config:
          min_trades_for_correlation: 10
      combination_generator:
        enabled: true
        config:
          portfolio_sizes: [5, 6, 7]  # Test 5, 6, and 7 ticker portfolios
          max_sector_concentration: 0.6
          max_correlation: 0.75
          min_trades_per_ticker: 100  # Lower threshold for 38-ticker pool
      portfolio_optimizer:
        enabled: true
        config:
          top_n: 50
      pypfopt_weights:
        enabled: true
        config:
          portfolio_sizes: [5, 6, 7]
          top_n: 10
          l2_regularization: 0.1
          target_volatility: 0.15
      equity_curves:
        enabled: true
        config:
          portfolio_sizes: [5, 6, 7]
          top_n: 5

integration:
  enhance_trades: false
  sample_size: null

paths:
  outputs_base: "D:\\Balcony\\Trading\\unified_trading_setup\\backtester\\outputs\\mse_exit_drop_005_all\\20251107_154802\\mse_strategy_backtesting\\2022-01-01_to_2025-08-31"
  base_data_dir: "D:\\Balcony\\Trading\\unified_trading_setup\\backtester\\outputs\\mse_exit_drop_005_all\\20251107_154802\\mse_strategy_backtesting\\2022-01-01_to_2025-08-31\\data\\base_data"
  merged_trades_file: "analysis/output/mse_strategy_backtesting/pool38_base/data/pool38_trades_merged.csv"
